<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in — OptimalPrint</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#06060e;color:#e8e8f0;min-height:100vh;padding:40px 20px;}
.bg{position:fixed;top:0;left:0;right:0;bottom:0;background:radial-gradient(ellipse at 30% 40%,rgba(108,99,255,0.08) 0%,transparent 60%),radial-gradient(ellipse at 80% 70%,rgba(79,70,229,0.06) 0%,transparent 60%);pointer-events:none;z-index:0;}
.container{position:relative;z-index:1;max-width:420px;margin:0 auto;}
.logo{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:700;color:#6c63ff;margin-bottom:36px;text-decoration:none;}
.card{background:rgba(17,17,28,0.8);border:1px solid rgba(108,99,255,0.2);border-radius:20px;padding:36px;backdrop-filter:blur(20px);box-shadow:0 0 60px rgba(108,99,255,0.1);}
h1{font-size:24px;font-weight:700;margin-bottom:6px;letter-spacing:-.02em;}
.sub{font-size:14px;color:#7070aa;margin-bottom:32px;}
.field{display:flex;flex-direction:column;gap:7px;margin-bottom:18px;}
.field label{font-size:12px;font-weight:600;color:#7070aa;letter-spacing:.03em;text-transform:uppercase;}
.field input{background:rgba(255,255,255,0.04);border:1px solid rgba(108,99,255,0.2);border-radius:10px;padding:13px 16px;font-size:14px;color:#e8e8f0;outline:none;transition:all .2s;}
.field input:focus{border-color:#6c63ff;background:rgba(108,99,255,0.06);box-shadow:0 0 0 3px rgba(108,99,255,0.1);}
.btn{width:100%;padding:13px;background:linear-gradient(135deg,#6c63ff,#4f46e5);color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;margin-top:8px;transition:all .2s;box-shadow:0 4px 20px rgba(108,99,255,0.3);}
.btn:hover{transform:translateY(-1px);box-shadow:0 6px 30px rgba(108,99,255,0.4);}
.link{text-align:center;margin-top:22px;font-size:13px;color:#7070aa;}
.link a{color:#a09aff;font-weight:500;}
.error{background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.3);border-radius:10px;padding:12px 16px;font-size:13px;color:#f87171;margin-bottom:18px;}
.divider{display:flex;align-items:center;gap:12px;margin:20px 0;color:#44445a;font-size:12px;}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:rgba(255,255,255,0.06);}
</style>
</head>
<body>
<div class="bg"></div>
<div class="container">
<a href="/" class="logo">
<svg width="26" height="26" viewBox="0 0 32 32" fill="none"><path d="M16 3L3 10l13 7 13-7-13-7z" stroke="#6c63ff" stroke-width="2" stroke-linejoin="round"/><path d="M3 22l13 7 13-7" stroke="#6c63ff" stroke-width="2" stroke-linejoin="round"/><path d="M3 16l13 7 13-7" stroke="#6c63ff" stroke-width="1.5" stroke-linejoin="round" opacity="0.5"/></svg>
OptimalPrint
</a>
<div class="card">
<h1>Welcome back 👋</h1>
<div class="sub">Log in to access your saved settings and print history</div>
{% with messages = get_flashed_messages(with_categories=true) %}
{% for cat,msg in messages %}<div class="error">{{ msg }}</div>{% endfor %}
{% endwith %}
<form method="POST">
<div class="field"><label>Email address</label><input type="email" name="email" placeholder="you@example.com" required></div>
<div class="field"><label>Password</label><input type="password" name="password" placeholder="Your password" required></div>
<button class="btn" type="submit">Log in to OptimalPrint</button>
</form>
<div class="divider">or</div>
<div class="link">Don't have an account? <a href="/register">Sign up free</a></div>
<div class="link" style="margin-top:10px;"><a href="/app" style="color:#44445a;">Continue without account →</a></div>
</div>
</div>
</body>
</html>
